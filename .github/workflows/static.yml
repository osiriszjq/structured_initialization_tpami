name: Static source checks
on: [push, pull_request]
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/check_source.py
      - run: python tools/run_suite.py plan --suite small > /tmp/small.json
      - run: python tools/run_suite.py plan --suite imagenet > /tmp/imagenet.json
